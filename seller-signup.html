<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Create Seller Account</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&family=Playfair+Display:wght@700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body class="auth-page">

<form id="sellerSignupForm">
    <h1>Create Seller Account</h1>

    <label for="sellerName">Full Name</label>
    <input type="text" id="sellerName" autocomplete="name" required>

    <label for="storeName">Store Name</label>
    <input type="text" id="storeName" autocomplete="organization" required>

    <label for="sellerEmail">Email Address</label>
    <input type="email" id="sellerEmail" autocomplete="email" required>

    <label for="sellerPassword">Password</label>
    <input type="password" id="sellerPassword" autocomplete="new-password" minlength="8" required>

    <label for="confirmSellerPassword">Confirm Password</label>
    <input type="password" id="confirmSellerPassword" autocomplete="new-password" minlength="8" required>

    <label class="password-toggle">
        <input type="checkbox" id="showSellerPasswords"> Show Passwords
    </label>

    <p id="sellerSignupMessage" class="error" role="status" aria-live="polite"></p>
    <p class="auth-note">Seller account creation is a preview and is not connected to registration yet.</p>
    <input type="submit" value="Create Seller Account">

    <p class="auth-link"><a href="website.html?account=seller">Back to Seller Sign In</a></p>
</form>

<script src="seller-signup.js"></script>
</body>
</html>
